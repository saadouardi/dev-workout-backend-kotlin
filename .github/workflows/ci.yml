name: CI

on:
  push:
    branches: [saad/improvements]
  pull_request:
    branches: [saad/improvements]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
      - run: ./gradlew build --no-daemon
